name: Sync Lichess games

on:
  schedule:
    - cron: "17 3 * * *"   # hver natt ca. 04:17 norsk tid
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lichess-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hent nye partier
        env:
          LICHESS_USER: Tafsle
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
        run: python scripts/sync.py
      - name: Commit
        run: |
          git config user.name "lichess-sync"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Sync $(date -u +%F)"
          git push
